backend:
  name: github
  repo: sekizuihan/mypage
  branch: main
  # アクセストークン（PAT）でログインする。OAuth サーバーが不要。
  # ※ auth_type / app_id は OAuth 用の設定なので書かない。
  #   （auth_type に "pat" という値は存在せず、書くと Netlify の
  #     OAuth サーバーへ飛ばされてログインが完了しなくなる）
  auth_methods:
    - token

media_folder: "img/uploads"
public_folder: "/img/uploads"

# 左メニューはサイトの構造順（トップ → About → 作品ページ）。
# 各ページ内の項目も、実際のページで表示される順（上から）に並んでいる。
collections:
  # ─── トップページ（index.html）───────────────────────────────────────────
  - name: "top"
    label: "トップページ"
    description: "index.html。上から「作品グリッド」→「Other works」の順に表示されます。"
    files:
      - name: "works_index"
        label: "① 作品グリッド"
        file: "content/works-index.json"
        fields:
          - label: "作品"
            name: "works"
            widget: "list"
            hint: "上から順に、グリッドの左上から並びます。「追加」すると一番上（左上）に入ります。ドラッグで並べ替えできます。"
            add_to_top: true
            collapsed: true
            summary: "{{fields.name}}"
            fields:
              - label: "リンク先URL"
                name: "url"
                widget: "string"
                hint: "例: works/Sway/ または work.html?slug=sway"
              - label: "サムネイル画像"
                name: "image"
                widget: "image"
              - label: "画像のalt属性"
                name: "alt"
                widget: "string"
              - label: "作品名（HTML可。改行は <br> で）"
                name: "name"
                widget: "string"
              - label: "使用ツール・年"
                name: "tools"
                widget: "string"

      - name: "other_works"
        label: "② Other works"
        file: "content/other-works.json"
        fields:
          - label: "活動"
            name: "items"
            widget: "list"
            hint: "上から順に表示されます。ドラッグで並べ替えできます。"
            collapsed: true
            summary: "{{fields.date}}　{{fields.title}}"
            fields:
              - label: "日付"
                name: "date"
                widget: "string"
                hint: "例: 2026/4"
              - label: "活動内容"
                name: "title"
                widget: "string"
              - label: "リンクURL（任意）"
                name: "link"
                widget: "string"
                required: false
              - label: "リンクのラベル（任意）"
                name: "linkLabel"
                widget: "string"
                required: false

  # ─── About ページ（works/About/index.html）────────────────────────────────
  - name: "about"
    label: "About ページ"
    description: "works/About/。上から「名前」→「About」→ 各セクション（Internship / Exhibition / …）の順に表示されます。"
    files:
      - name: "about"
        label: "About ページ"
        file: "content/about.json"
        fields:
          - label: "名前（ページ最上部）"
            name: "name"
            widget: "string"
          - label: "About（自己紹介文）"
            name: "bio"
            widget: "text"
            hint: "空行をはさむと段落が分かれます。"
          - label: "セクション"
            name: "sections"
            widget: "list"
            hint: "Internship / Exhibition などの見出しごとのまとまり。上から順に表示されます。ドラッグで並べ替えできます。"
            collapsed: true
            summary: "{{fields.title}}"
            fields:
              - label: "見出し"
                name: "title"
                widget: "string"
                hint: "例: Exhibition / VJ / Live visual"
              - label: "項目"
                name: "items"
                widget: "list"
                hint: "上から順に表示されます。「追加」すると一番上に入ります。"
                add_to_top: true
                collapsed: true
                summary: "{{fields.date}}　{{fields.text}}"
                fields:
                  - label: "日付"
                    name: "date"
                    widget: "string"
                    hint: "例: 2026/10 や 2024/9-10"
                  - label: "内容"
                    name: "text"
                    widget: "string"
                    hint: "例: グループ展「〇〇」@会場名"
                  - label: "リンクURL（任意）"
                    name: "link"
                    widget: "string"
                    required: false
                    hint: "サイト内の作品ページなら ../../works/フォルダ名/"
                  - label: "リンクのラベル（任意）"
                    name: "linkLabel"
                    widget: "string"
                    required: false
                    hint: "例: Info / Detail / Article"

  # ─── 作品ページ（works/<フォルダ名>/ と work.html?slug=...）─────────────
  - name: "work_pages"
    label: "作品ページ"
    label_singular: "作品ページ"
    description: "各作品の詳細ページ。上から「タイトル・年」→ メイン画像 → サブ画像 → YouTube → 動画 → ギャラリー → About の順に表示されます。"
    folder: "content/works"
    create: true
    slug: "{{slug}}"
    identifier_field: "title"
    extension: "json"
    format: "json"
    summary: "{{year}}　{{title}}"
    sortable_fields:
      fields: ["year", "title", "slug"]
      default:
        field: "year"
        direction: "descending"
    fields:
      - label: "スラッグ（ファイル名・URL）"
        name: "slug"
        widget: "string"
        pattern: ['^[A-Za-z0-9._-]+$', "半角英数字と . _ - だけ使えます"]
        hint: "既存の作品は変更しないでください（ページが表示されなくなります）。新しい作品は work.html?slug=ここの値 で表示されます。例: flow-vol8"
      - label: "タイトル"
        name: "title"
        widget: "string"
        hint: "例: Flow vol.8 VJ"
      - label: "年"
        name: "year"
        widget: "string"
        hint: "例: 2026 / 2020~"
      - label: "メイン画像"
        name: "main_images"
        widget: "list"
        collapsed: true
        summary: "{{fields.src}}"
        hint: "タイトルのすぐ下に大きく表示されます。複数入れると縦に並びます。"
        fields:
          - { label: "画像", name: "src", widget: "image" }
          - { label: "代替テキスト（alt）", name: "alt", widget: "string", required: false }
      - label: "サブ画像"
        name: "sub_images"
        widget: "list"
        required: false
        collapsed: true
        summary: "{{fields.src}}"
        hint: "メイン画像の下に表示されます（任意）。"
        fields:
          - { label: "画像", name: "src", widget: "image" }
          - { label: "代替テキスト（alt）", name: "alt", widget: "string", required: false }
      - label: "YouTube"
        name: "youtube"
        widget: "list"
        required: false
        collapsed: true
        summary: "{{fields.url}}"
        hint: "YouTube の URL をそのまま貼れば埋め込みになります（任意）。"
        fields:
          - { label: "YouTube の URL", name: "url", widget: "string" }
      - label: "動画ファイル"
        name: "videos"
        widget: "list"
        required: false
        collapsed: true
        summary: "{{fields.src}}"
        hint: "mp4 などの動画ファイル（任意）。"
        fields:
          - { label: "動画", name: "src", widget: "file" }
      - label: "ギャラリー画像"
        name: "gallery_images"
        widget: "list"
        required: false
        collapsed: true
        summary: "{{fields.src}}"
        hint: "小さい画像のグリッド（任意）。上から順に左上から並びます。"
        fields:
          - { label: "画像", name: "src", widget: "image" }
          - { label: "代替テキスト（alt）", name: "alt", widget: "string", required: false }
      - label: "ギャラリーの表示スタイル"
        name: "gallery_style"
        widget: "select"
        default: "cs"
        options:
          - { label: "標準（16:9 で切り抜き）", value: "cs" }
          - { label: "3列（高さ固定・GIF 向け）", value: "cs_an" }
      - label: "About（説明文）"
        name: "description"
        widget: "text"
        required: false
        hint: "改行はそのまま改行になります。リンクは `[表示する文字](https://...)` と書きます。"
