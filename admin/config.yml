backend:
  name: github
  repo: sekizuihan/mypage
  branch: main
  # アクセストークン（PAT）でログインする。OAuth サーバーが不要。
  # ※ auth_type / app_id は OAuth 用の設定なので書かない。
  #   （auth_type に "pat" という値は存在せず、書くと Netlify の
  #     OAuth サーバーへ飛ばされてログインが完了しなくなる）
  auth_methods:
    - token

media_folder: "img/uploads"
public_folder: "/img/uploads"

# 左メニューはサイトの構造順（トップ → About → 作品ページ）。
# 各ページ内の項目も、実際のページで表示される順（上から）に並んでいる。
collections:
  # ─── トップページ（index.html）───────────────────────────────────────────
  - name: "top"
    label: "トップページ"
    description: "index.html。上から「作品グリッド」→「Other works」の順に表示されます。"
    files:
      - name: "works_index"
        label: "① 作品グリッド"
        file: "content/works-index.json"
        fields:
          - label: "作品"
            name: "works"
            widget: "list"
            hint: "上から順に、グリッドの左上から並びます。「追加」すると一番上（左上）に入ります。ドラッグで並べ替えできます。"
            add_to_top: true
            collapsed: true
            summary: "{{fields.name}}"
            fields:
              - label: "リンク先URL"
                name: "url"
                widget: "string"
                hint: "例: works/Sway/ または work.html?slug=sway"
              - label: "サムネイル画像"
                name: "image"
                widget: "image"
              - label: "画像のalt属性"
                name: "alt"
                widget: "string"
              - label: "作品名（HTML可。改行は <br> で）"
                name: "name"
                widget: "string"
              - label: "使用ツール・年"
                name: "tools"
                widget: "string"

      - name: "other_works"
        label: "② Other works"
        file: "content/other-works.json"
        fields:
          - label: "活動"
            name: "items"
            widget: "list"
            hint: "上から順に表示されます。ドラッグで並べ替えできます。"
            collapsed: true
            summary: "{{fields.date}}　{{fields.title}}"
            fields:
              - label: "日付"
                name: "date"
                widget: "string"
                hint: "例: 2026/4"
              - label: "活動内容"
                name: "title"
                widget: "string"
              - label: "リンクURL（任意）"
                name: "link"
                widget: "string"
                required: false
              - label: "リンクのラベル（任意）"
                name: "linkLabel"
                widget: "string"
                required: false

  # ─── About ページ（works/About/index.html）────────────────────────────────
  - name: "about"
    label: "About ページ"
    description: "works/About/。上から「名前」→「About」→ 各セクション（Internship / Exhibition / …）の順に表示されます。"
    files:
      - name: "about"
        label: "About ページ"
        file: "content/about.json"
        fields:
          - label: "名前（ページ最上部）"
            name: "name"
            widget: "string"
          - label: "About（自己紹介文）"
            name: "bio"
            widget: "text"
            hint: "空行をはさむと段落が分かれます。"
          - label: "セクション"
            name: "sections"
            widget: "list"
            hint: "Internship / Exhibition などの見出しごとのまとまり。上から順に表示されます。ドラッグで並べ替えできます。"
            collapsed: true
            summary: "{{fields.title}}"
            fields:
              - label: "見出し"
                name: "title"
                widget: "string"
                hint: "例: Exhibition / VJ / Live visual"
              - label: "項目"
                name: "items"
                widget: "list"
                hint: "上から順に表示されます。「追加」すると一番上に入ります。"
                add_to_top: true
                collapsed: true
                summary: "{{fields.date}}　{{fields.text}}"
                fields:
                  - label: "日付"
                    name: "date"
                    widget: "string"
                    hint: "例: 2026/10 や 2024/9-10"
                  - label: "内容"
                    name: "text"
                    widget: "string"
                    hint: "例: グループ展「〇〇」@会場名"
                  - label: "リンクURL（任意）"
                    name: "link"
                    widget: "string"
                    required: false
                    hint: "サイト内の作品ページなら ../../works/フォルダ名/"
                  - label: "リンクのラベル（任意）"
                    name: "linkLabel"
                    widget: "string"
                    required: false
                    hint: "例: Info / Detail / Article"

  # ─── 個別作品ページ（テンプレート方式・新規作品用）─────────────────────
  - name: "work_pages"
    label: "作品ページ（新規作成用）"
    folder: "content/works"
    create: true
    slug: "{{slug}}"
    extension: "json"
    format: "json"
    summary: "{{title}} ({{year}})"
    fields:
      - label: "スラッグ（URL用・半角英数字とハイフンのみ）"
        name: "slug"
        widget: "string"
        hint: "例: flow-vol8 → work.html?slug=flow-vol8 でアクセスできます"
      - label: "タイトル"
        name: "title"
        widget: "string"
        hint: "例: Flow vol.8"
      - label: "サブタイトル（種別）"
        name: "subtitle"
        widget: "string"
        hint: "例: VJ / インスタレーション / 個展 / MV"
      - label: "年"
        name: "year"
        widget: "number"
        value_type: "int"
      - label: "使用ツール・メディア"
        name: "tools"
        widget: "string"
        hint: "例: TouchDesigner / 2026"
      - label: "メイン画像（上部大画像）"
        name: "main_images"
        widget: "list"
        collapsed: false
        summary: "{{fields.alt}}"
        fields:
          - label: "画像"
            name: "src"
            widget: "image"
          - label: "alt属性"
            name: "alt"
            widget: "string"
      - label: "サブ画像（メイン下の大画像・任意）"
        name: "sub_images"
        widget: "list"
        required: false
        collapsed: true
        summary: "{{fields.alt}}"
        fields:
          - label: "画像"
            name: "src"
            widget: "image"
          - label: "alt属性"
            name: "alt"
            widget: "string"
      - label: "動画（任意）"
        name: "videos"
        widget: "list"
        required: false
        collapsed: true
        summary: "{{fields.alt}}"
        fields:
          - label: "動画ファイル"
            name: "src"
            widget: "file"
          - label: "alt属性"
            name: "alt"
            widget: "string"
      - label: "ギャラリー画像（グリッド表示・任意）"
        name: "gallery_images"
        widget: "list"
        required: false
        collapsed: true
        summary: "{{fields.alt}}"
        fields:
          - label: "画像"
            name: "src"
            widget: "image"
          - label: "alt属性"
            name: "alt"
            widget: "string"
      - label: "説明文（About）"
        name: "description"
        widget: "markdown"
        hint: "About セクションの本文。Markdown で記述できます。"
