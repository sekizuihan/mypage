<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Yoneda Nanaho</title>
  <link rel="stylesheet" href="css/bootstrap.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" integrity="sha512-Fo3rlrZj/k7ujTnHg4CGR2D7kSs0v4LgzfgAyPHGU4L/9h/VD8T/mRxIdOMSGTFXXhHBl35OBdJ9S6sxOYw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="icon" href="img/favicon_cat.ico">
  <link rel="apple-touch-icon" href="img/0009.png" sizes="180x180">
</head>

<body>
  <main>
    <div class="container">
      <header>
        <ul class="menu-group">
          <li class="menu-item_l"><img src="img/green_circle.png" class="icon_xs"></li>
          <li class="menu-item"><a href="works/About/index.html">About</a></li>
          <li class="menu-item"><a href="index.html"><img src="img/cat_animation_s.gif" alt="cat walk" class="icon_s"></a></li>
          <li class="menu-item"><a href="https://linktr.ee/sekizuihan">Contact / SNS</a></li>
        </ul>
      </header>
      <div class="header"></div>
    </div>

    <section>
      <ul class="cs" id="works-list">
        <!-- content/works-index.json から動的に生成 -->
      </ul>
    </section>

    <section>
      <div class="text">
        <h3>Other works</h3>
        <br>
        <font color="#a9a9a9">
          <p id="other-works-list">
            <!-- content/other-works.json から動的に生成 -->
          </p>
        </font>
      </div>
    </section>

    <a href="#" id="totop"></a>

  </div>
  </main>

  <footer><br></footer>
  <a href="#" id="page_top"></a>

  <script>
    // 作品グリッドを読み込んで表示
    fetch('/content/works-index.json')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        var list = document.getElementById('works-list');
        list.innerHTML = data.works.map(function(w) {
          return '<li><a href="' + w.url + '">' +
            '<img src="' + w.image + '" alt="' + w.alt + '">' +
            '<div class="text">' +
            '<p class="name">' + w.name + '</p>' +
            '<p>' + w.tools + '</p>' +
            '</div>' +
            '</a></li>';
        }).join('');
      })
      .catch(function(e) {
        console.error('作品一覧の読み込みに失敗しました:', e);
      });

    // Other works を読み込んで表示
    fetch('/content/other-works.json')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        var container = document.getElementById('other-works-list');
        container.innerHTML = data.items.map(function(item) {
          var text = item.date + '　' + item.title;
          if (item.link) {
            text += '　<a href="' + item.link + '"><font color="#a9a9a9"><u>' + item.linkLabel + '</u></font></a>';
          }
          return text + '<br><br>';
        }).join('');
      })
      .catch(function(e) {
        console.error('Other works の読み込みに失敗しました:', e);
      });
  </script>

</body>
</html>
