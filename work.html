<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Yoneda Nanaho</title>
  <link rel="stylesheet" href="css/bootstrap.css">
  <link rel="stylesheet" href="css/style_works.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" integrity="sha512-Fo3rlrZj/k7ujTnHg4CGR2D7kSs0v4LgzfgAyPHGU4L/9h/VD8T/mRxIdOMSGTFXXhHBl35OBdJ9S6sxOYw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="icon" href="img/favicon_cat.ico">
  <link rel="apple-touch-icon" href="img/0009.png" sizes="180x180">
</head>

<body>
  <main>
    <div class="container">
      <header>
        <ul class="menu-group">
          <li class="menu-item_l"><a href="index.html"><img src="img/cat_animation_s.gif" alt="cat walk" class="icon_s"></a></li>
          <li class="menu-item"><a href="works/About/index.html">About</a></li>
          <li class="menu-item"><a href="index.html">Works</a></li>
          <li class="menu-item"><a href="https://linktr.ee/sekizuihan">Contact / SNS</a></li>
        </ul>
      </header>

      <!-- 作品の内容は content/works/<slug>.json から生成（admin の「作品ページ」で編集） -->

      <a href="#" id="totop"></a>
    </div>
  </main>

  <footer><br></footer>
  <a href="#" id="page_top"></a>

  <script src="js/render.js?v=2"></script>
  <script>
    // 新しく追加した作品は work.html?slug=<スラッグ> で表示する
    var slug = new URLSearchParams(window.location.search).get('slug');

    function notFound() {
      document.querySelector('.container > header')
        .insertAdjacentHTML('afterend', '<p style="padding:2em 0;">作品が見つかりませんでした。</p>');
    }

    if (!slug) {
      notFound();
    } else {
      fetch('content/works/' + encodeURIComponent(slug) + '.json')
        .then(function(r) {
          if (!r.ok) throw new Error('not found');
          return r.json();
        })
        .then(function(data) {
          document.title = data.title + ' | Yoneda Nanaho';
          document.querySelector('.container > header')
            .insertAdjacentHTML('afterend', PortfolioRender.workHTML(data, { base: '' }));
        })
        .catch(notFound);
    }
  </script>
</body>
</html>
